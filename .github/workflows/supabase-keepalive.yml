name: Supabase keepalive

on:
  schedule:
    - cron: "17 9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query family snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FAMILY_EDIT_KEY: ${{ secrets.FAMILY_EDIT_KEY }}
          TREE_ID: ${{ vars.TREE_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$FAMILY_EDIT_KEY"
          test -n "$TREE_ID"

          url="${SUPABASE_URL%/}/rest/v1/family_snapshots?tree_id=eq.${TREE_ID}&select=revision"
          status="$(
            curl -sS -o /tmp/raices-keepalive.json -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "x-family-edit-key: ${FAMILY_EDIT_KEY}" \
              "$url"
          )"

          if [ "$status" != "200" ]; then
            echo "Supabase keepalive failed with HTTP ${status}"
            cat /tmp/raices-keepalive.json
            exit 1
          fi

          cat /tmp/raices-keepalive.json
