name: Supabase keepalive

on:
  schedule:
    - cron: "17 9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query family snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          url="${SUPABASE_URL%/}/rest/v1/rpc/raices_keepalive"
          status="$(
            curl -sS -o /tmp/raices-keepalive.json -w "%{http_code}" \
              -X POST \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "$url"
          )"

          if [ "$status" != "200" ]; then
            echo "Supabase keepalive failed with HTTP ${status}"
            cat /tmp/raices-keepalive.json
            exit 1
          fi

          cat /tmp/raices-keepalive.json
